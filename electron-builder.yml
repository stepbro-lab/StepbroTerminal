appId: com.stepbro.terminal
# The name people see: window titles, the Dock, the Start Menu, notifications, the installer.
productName: stepbro terminal
copyright: Copyright © 2026 Kevin
# step:// links: notification buttons, and step://workspace/<name> to open a workspace from a script.
protocols:
  - name: stepbro terminal
    schemes:
      - step
directories:
  buildResources: build
  output: release
# Installers go to the public releases repository.
publish:
  provider: github
  owner: kevin9038440334
  repo: StepbroTerminal-releases
  releaseType: prerelease
# node-pty ships N-API prebuilds that work in Electron without a rebuild.
npmRebuild: false
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  # The master logo only feeds scripts/gen-icons.mjs; the app ships the rendered sizes.
  - from: resources/icons
    to: icons
    filter:
      - '!StepbroLogo.png'
# The host runs as a plain Node process, so it and node-pty must live outside the asar.
# The host runs as a plain Node process outside the asar, so everything it requires must be
# unpacked with it: the bytecode loader, its own bytecode, the chunk it shares with the main
# process, and node-pty.
asarUnpack:
  - out/main/**
  - '**/node_modules/node-pty/**'
# Flips Electron's fuses on the packed binary: no debugger flags, no NODE_OPTIONS injection.
afterPack: scripts/after-pack.cjs
win:
  target:
    - nsis
  icon: build/icon.png
  # The file names stay as they were: the installed folder, the .exe the step:// handler points
  # at and the update feed all carry this name, and a space would only get in the way there.
  executableName: StepbroTerminal
  artifactName: StepbroTerminal-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  # Both architectures come out of one Apple Silicon runner.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # Same artwork with room around it, the way Dock icons are drawn.
  icon: build/icon-mac.png
  category: public.app-category.developer-tools
  hardenedRuntime: false
  # Lets Finder and the Dock accept a folder dropped on the app: it opens as a project.
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
  artifactName: StepbroTerminal-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
  executableName: StepbroTerminal
  artifactName: StepbroTerminal-${version}-linux-${arch}.${ext}
