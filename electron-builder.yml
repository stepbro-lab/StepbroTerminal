appId: com.stepbro.terminal
productName: StepbroTerminal
copyright: Copyright © 2026 Kevin
directories:
  buildResources: build
  output: release
# Installers go to the public releases repository.
publish:
  provider: github
  owner: kevin9038440334
  repo: StepbroTerminal-releases
  releaseType: prerelease
# node-pty ships N-API prebuilds that work in Electron without a rebuild.
npmRebuild: false
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources/icons
    to: icons
# The host runs as a plain Node process, so it and node-pty must live outside the asar.
asarUnpack:
  - out/main/host.js
  - '**/node_modules/node-pty/**'
win:
  target:
    - nsis
  icon: build/icon.png
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  # Both architectures come out of one Apple Silicon runner.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
