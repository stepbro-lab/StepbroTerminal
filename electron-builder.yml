appId: com.stepbro.terminal
productName: stepbro terminal
copyright: Copyright © 2026 Kevin
protocols:
  - name: stepbro terminal
    schemes:
      - step
directories:
  buildResources: build
  output: release
publish:
  provider: github
  owner: kevin9038440334
  repo: StepbroTerminal-releases
  releaseType: prerelease
npmRebuild: false
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources/icons
    to: icons
    filter:
      - '!StepbroLogoLight.png'
      - '!StepbroLogoDark.png'
# The host runs as a plain Node process, so it has to live outside the asar.
asarUnpack:
  - out/main/**
  - '**/node_modules/node-pty/**'
afterPack: scripts/after-pack.cjs
win:
  target:
    - nsis
  icon: build/icon.png
  executableName: StepbroTerminal
  artifactName: StepbroTerminal-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon-mac.png
  category: public.app-category.developer-tools
  defaultArch: arm64
  hardenedRuntime: false
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
  artifactName: StepbroTerminal-${version}-mac-${arch}.${ext}
dmg:
  title: stepbro terminal${arch}
  background: build/dmg-background.png
  window:
    width: 540
    height: 380
  iconSize: 88
  iconTextSize: 12
  contents:
    - x: 150
      y: 190
      type: file
    - x: 390
      y: 190
      type: link
      path: /Applications
# Linux builds go by stepbro-terminal: a space in /opt/<productName> breaks Chromium's sandbox.
linux:
  target:
    - AppImage
    - deb
  icon: build/icons
  category: Development
  description: A terminal for people who run coding agents all day.
  executableName: StepbroTerminal
  artifactName: StepbroTerminal-${version}-linux-${arch}.${ext}
  desktop:
    Name: stepbro terminal
    StartupWMClass: stepbro terminal
deb:
  afterInstall: build/linux/after-install.tpl
  afterRemove: build/linux/after-remove.tpl
