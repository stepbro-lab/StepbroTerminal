name: linux package

on:
  push:
    paths:
      - build/linux/**
      - electron-builder.yml
      - scripts/gen-icons.mjs
      - .github/workflows/linux-package.yml
  pull_request:
    paths:
      - build/linux/**
      - electron-builder.yml
      - scripts/gen-icons.mjs
      - .github/workflows/linux-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons
      - run: pnpm build

      - name: Build the .deb as a release does
        run: pnpm exec electron-builder --linux deb --publish never -c.productName=stepbro-terminal

      - name: Restrict user namespaces as Ubuntu does
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb apparmor-utils > /dev/null

      - name: Install the last release and see it fail
        run: |
          curl -fsSL -o old.deb https://github.com/kevin9038440334/StepbroTerminal-releases/releases/download/v0.1.0-beta.27/StepbroTerminal-0.1.0-beta.27-linux-amd64.deb
          sudo apt-get install -y -qq ./old.deb > /dev/null
          xvfb-run -a timeout 20 "/opt/stepbro terminal/StepbroTerminal" > old.log 2>&1 || true
          grep -E "FATAL|sandbox" old.log || echo "(0.1.0-beta.27 did not report a sandbox failure here)"
          pkill -f StepbroTerminal || true

      - name: Upgrade to this build
        run: sudo dpkg -i release/*.deb

      - name: Check what it installed
        run: |
          set -euxo pipefail
          test -x /opt/stepbro-terminal/StepbroTerminal
          test ! -e "/opt/stepbro terminal"
          test "$(readlink -f /usr/bin/StepbroTerminal)" = /opt/stepbro-terminal/StepbroTerminal
          cat /etc/apparmor.d/stepbro-terminal
          sudo aa-status | grep -F stepbro-terminal
          stat -c '%a %U:%G %n' /opt/stepbro-terminal/chrome-sandbox
          for s in 16 24 32 48 64 128 256 512; do test -f "/usr/share/icons/hicolor/${s}x${s}/apps/StepbroTerminal.png"; done
          desktop=/usr/share/applications/StepbroTerminal.desktop
          grep -E '^(Name|Exec|Icon|StartupWMClass)=' "$desktop"
          grep -qx 'Name=stepbro terminal' "$desktop"
          grep -qx 'StartupWMClass=stepbro terminal' "$desktop"

      - name: Start it with the sandbox on
        run: |
          set -euxo pipefail
          xvfb-run -a timeout 30 /opt/stepbro-terminal/StepbroTerminal > app.log 2>&1 &
          sleep 20
          ps -eo pid,args | grep -F /opt/stepbro-terminal | grep -v grep | cut -c1-160 || true
          ps -eo args | grep -xF '/opt/stepbro-terminal/StepbroTerminal --type=zygote'
          test "$(pgrep -fc 'out/main/host.js')" -eq 1
          wait || true
          cat app.log
          cat ~/.step/host.log
          test "$(grep -c 'spawning host' app.log)" -eq 1
          test "$(grep -c 'step-host .* starting' ~/.step/host.log)" -eq 1
          if grep -E 'FATAL|SUID sandbox helper|failed to execvp' app.log; then exit 1; fi

      - name: Remove it
        run: |
          set -euxo pipefail
          pkill -f StepbroTerminal || true
          sudo apt-get remove -y -qq step-terminal > /dev/null
          test ! -e /etc/apparmor.d/stepbro-terminal
          ! sudo aa-status | grep -F stepbro-terminal
          test ! -e /usr/bin/StepbroTerminal
