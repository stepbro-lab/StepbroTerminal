name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: release page
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node --experimental-strip-types scripts/release-notes.mjs "$VERSION" > notes.md
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file notes.md --prerelease --target "$GITHUB_SHA"
          fi

  build:
    needs: prepare
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm icons

      - run: pnpm build

      - name: Name the Linux build
        if: runner.os == 'Linux'
        run: echo "BUILDER_ARGS=-c.productName=stepbro-terminal" >> "$GITHUB_ENV"

      - name: Check the packaged host starts
        run: pnpm exec electron-builder --dir $BUILDER_ARGS && node scripts/smoke-packaged-host.mjs

      # Spotlight keeps a mounted image busy, and hdiutil detach then fails.
      - name: Keep Spotlight off the disk images
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --publish always $BUILDER_ARGS
