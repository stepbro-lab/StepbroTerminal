name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: release page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Write the README and create the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: kevin9038440334/StepbroTerminal-releases
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node --experimental-strip-types scripts/release-notes.mjs "$VERSION" > notes.md
          node --experimental-strip-types scripts/release-notes.mjs "$VERSION" --readme > README.md
          SHA=$(gh api "repos/$REPO/contents/README.md" --jq .sha)
          gh api -X PUT "repos/$REPO/contents/README.md" -f message="$VERSION" -f content="$(base64 -w0 README.md)" -f sha="$SHA" > /dev/null
          if gh release view "v$VERSION" --repo "$REPO" > /dev/null 2>&1; then
            gh release edit "v$VERSION" --repo "$REPO" --title "$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" --repo "$REPO" --title "$VERSION" --notes-file notes.md --prerelease --target main
          fi

  build:
    needs: prepare
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm icons

      - run: pnpm build

      - name: Name the Linux build
        if: runner.os == 'Linux'
        run: echo "BUILDER_ARGS=-c.productName=stepbro-terminal" >> "$GITHUB_ENV"

      - name: Check the packaged host starts
        run: pnpm exec electron-builder --dir $BUILDER_ARGS && node scripts/smoke-packaged-host.mjs

      # Spotlight keeps a mounted image busy, and hdiutil detach then fails.
      - name: Keep Spotlight off the disk images
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: pnpm exec electron-builder --publish always $BUILDER_ARGS
