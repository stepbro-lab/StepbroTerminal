name: Release

# Builds installers for Windows, macOS and Linux and publishes them as a GitHub release
# on the public releases repository. Runs when a version tag is pushed, or by hand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm icons

      - name: Build and publish
        env:
          # Fine-grained token with contents:write on StepbroTerminal-releases.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: pnpm build && pnpm exec electron-builder --publish always
