name: Feature request
description: Suggest something new or a better way to do something.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Open-ended ideas and questions also fit well in [Discussions](https://github.com/stepbro-lab/StepbroTerminal/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. Mockups or examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - I would like to send a pull request
        - I can help test it
        - No, just suggesting it
